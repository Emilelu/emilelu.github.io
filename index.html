<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emilelu · 导航</title>
<meta name="description" content="Emilelu 的个人应用导航：追番管理 PBM、日语语法 Bunpō、英语词表 OCAT++。">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1d26;
    --muted: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117;
      --card: #1a1d26;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2e3a;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 16px 40px rgba(0, 0, 0, 0.6);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    transition: background 0.3s ease, color 0.3s ease;
  }
  header { text-align: center; margin-bottom: 40px; }
  header .avatar {
    width: 72px; height: 72px; border-radius: 50%;
    object-fit: cover; margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: 0.5px; }
  header p { color: var(--muted); margin-top: 8px; font-size: 15px; }
  nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 860px;
  }
  a.card {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; text-align: center;
    padding: 32px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  a.card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    border-color: #6366f1;
  }
  a.card .icon { font-size: 40px; line-height: 1; }
  a.card .name { font-size: 19px; font-weight: 700; }
  a.card .desc { color: var(--muted); font-size: 13.5px; line-height: 1.6; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <header>
    <img class="avatar" src="favicon.png" alt="Emilelu">
    <h1>Emilelu 应用导航</h1>
    <p>学习工具与个人应用</p>
  </header>

  <nav>
    <a class="card" href="pbm.html">
      <span class="icon">📺</span>
      <span class="name">PBM · 追番管理</span>
      <span class="desc">Project Banager 单文件应用：追番进度、评分与备注管理，支持 Excel 导入导出。</span>
    </a>
    <a class="card" href="bunpo.html">
      <span class="icon">📖</span>
      <span class="name">Bunpō · 日语语法</span>
      <span class="desc">Bunpō Notes 语法笔记：日语助词、句型与用法整理。</span>
    </a>
    <a class="card" href="ocat.html">
      <span class="icon">🗂️</span>
      <span class="name">OCAT++ · 英语词表</span>
      <span class="desc">OCAT++ 单词管理：词表分组、检索与发音朗读。</span>
    </a>
  </nav>

  <footer>© <span id="year"></span> Emilelu</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
